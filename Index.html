<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Heure Caisson</title>
  <style>
    /* ─── RESET & BASE ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #f4f6fa;
      --surface:    #ffffff;
      --primary:    #2563eb;
      --primary-lt: #dbeafe;
      --accent:     #1d4ed8;
      --text:       #1e293b;
      --muted:      #64748b;
      --border:     #e2e8f0;
      --green:      #16a34a;
      --green-lt:   #dcfce7;
      --amber:      #d97706;
      --amber-lt:   #fef3c7;
      --blue-lt:    #eff6ff;
      --radius:     10px;
      --shadow:     0 1px 4px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 20px 24px 16px;
    }
    header h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: .3px;
    }
    header p {
      opacity: .8;
      font-size: .85rem;
      margin-top: 4px;
    }

    /* ─── MAIN WRAPPER ─── */
    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    /* ─── FILTRES ─── */
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 8px 18px;
      border: 2px solid var(--border);
      background: var(--surface);
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: all .18s;
    }
    .filter-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .filter-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ─── TUILES STATS ─── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow);
      border-top: 4px solid var(--primary);
    }
    .stat-card.green  { border-top-color: var(--green); }
    .stat-card.amber  { border-top-color: var(--amber); }
    .stat-card .label {
      font-size: .78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .stat-card .value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }
    .stat-card .sub {
      font-size: .8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ─── SECTION TITRE ─── */
    .section-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 14px;
    }

    /* ─── TABLEAU ─── */
    .table-wrapper {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    thead th {
      background: var(--blue-lt);
      color: var(--primary);
      font-weight: 700;
      text-align: left;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    thead th:not(:first-child) {
      text-align: center;
    }
    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background .12s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--bg); }
    tbody td {
      padding: 11px 16px;
      color: var(--text);
      white-space: nowrap;
    }
    tbody td:not(:first-child) {
      text-align: center;
      color: var(--muted);
    }
    .td-total {
      font-weight: 700;
      color: var(--primary) !important;
      background: var(--primary-lt);
    }
    .td-zero { color: var(--border) !important; }

    /* ─── TRI ─── */
    thead th { cursor: pointer; user-select: none; position: relative; padding-right: 26px; }
    thead th::after {
      content: '⇅';
      position: absolute;
      right: 8px;
      opacity: .3;
      font-size: .8em;
    }
    thead th.sort-asc::after  { content: '↑'; opacity: 1; }
    thead th.sort-desc::after { content: '↓'; opacity: 1; }

    /* ─── BOUTON GÉRER ─── */
    .btn-manage {
      margin-left: auto;
      padding: 8px 18px;
      border: 2px solid var(--primary);
      background: var(--surface);
      border-radius: 99px;
      font-size: .88rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
      transition: all .18s;
    }
    .btn-manage:hover { background: var(--primary); color: #fff; }

    /* ─── MODAL ─── */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 100;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
      overflow-y: auto;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 8px 40px rgba(0,0,0,.2);
      width: 100%;
      max-width: 480px;
      padding: 28px 24px;
    }
    .modal h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .modal-close {
      margin-left: auto;
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      color: var(--muted);
      line-height: 1;
    }
    .modal-close:hover { color: var(--text); }

    /* liste agents dans modal */
    .agent-row {
      display: flex;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--border);
      gap: 10px;
    }
    .agent-row:last-child { border-bottom: none; }
    .agent-row .agent-name { flex: 1; font-size: .9rem; }
    .agent-row .agent-name.hidden-name { color: var(--muted); text-decoration: line-through; }
    .toggle-btn {
      padding: 4px 12px;
      border-radius: 99px;
      border: 1.5px solid;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .toggle-btn.visible  { border-color: var(--green); color: var(--green); background: var(--green-lt); }
    .toggle-btn.hidden-  { border-color: var(--muted); color: var(--muted); background: var(--bg); }
    .toggle-btn:disabled { opacity: .5; cursor: not-allowed; }
    .move-btn {
      padding: 4px 9px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
      line-height: 1;
    }
    .move-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); background: var(--primary-lt); }
    .move-btn:disabled { opacity: .25; cursor: not-allowed; }

    /* ajout agent */
    .add-agent-form {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 2px solid var(--border);
    }
    .add-agent-form label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 8px;
    }
    .add-agent-form .input-row {
      display: flex; gap: 8px;
    }
    .add-agent-form input {
      flex: 1;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-size: .9rem;
      outline: none;
      transition: border-color .15s;
    }
    .add-agent-form input:focus { border-color: var(--primary); }
    .add-agent-form .btn-add {
      padding: 9px 18px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s;
    }
    .add-agent-form .btn-add:hover { background: var(--accent); }
    .add-agent-form .btn-add:disabled { opacity: .5; cursor: not-allowed; }
    .modal-msg {
      margin-top: 10px;
      font-size: .83rem;
      padding: 6px 10px;
      border-radius: 6px;
    }
    .modal-msg.ok  { background: var(--green-lt); color: var(--green); }
    .modal-msg.err { background: #fee2e2; color: #dc2626; }

    /* ─── MESSAGE VIDE ─── */
    .empty-msg {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-msg svg {
      display: block;
      margin: 0 auto 16px;
      opacity: .35;
    }
    .empty-msg p { font-size: .95rem; }

    /* ─── SPINNER ─── */
    .spinner-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 64px 0;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      header h1 { font-size: 1.1rem; }
      .stat-card .value { font-size: 1.6rem; }
      table { font-size: .82rem; }
      thead th, tbody td { padding: 10px 10px; }
    }
  </style>
</head>
<body>

<header>
  <h1>🫧 Suivi Heure Caisson</h1>
  <p>Analyse des heures de travail réalisées en séance caisson</p>
</header>

<main>

  <!-- Filtres (générés dynamiquement) -->
  <div class="filters" id="filters"></div>

  <!-- Modal gestion agents -->
  <div class="modal-overlay" id="modalOverlay" onclick="fermerSiExterieur(event)">
    <div class="modal">
      <h2>
        👥 Gestion des agents
        <button class="modal-close" onclick="fermerGestion()">✕</button>
      </h2>
      <div id="modalAgentsList">
        <div class="spinner-wrap" style="padding:24px 0"><div class="spinner"></div></div>
      </div>
      <div class="add-agent-form">
        <label>Ajouter un nouvel agent</label>
        <div class="input-row">
          <input type="text" id="newAgentInput" placeholder="NOM Prénom" onkeydown="if(event.key==='Enter') ajouterAgent()">
          <button class="btn-add" id="btnAjout" onclick="ajouterAgent()">Ajouter</button>
        </div>
        <div id="modalMsg" class="modal-msg" style="display:none"></div>
      </div>
    </div>
  </div>

  <!-- Zone de contenu (spinner → stats + tableau) -->
  <div id="content">
    <div class="spinner-wrap"><div class="spinner"></div></div>
  </div>

</main>

<script>
  var filtreActif = 'annee_courante';
  var donneesActuelles = null;
  var sortCol = 'nom';
  var sortAsc = true;

  // ─── Génération dynamique des boutons de filtre ──────────────────────
  function buildFiltres() {
    var annee = new Date().getFullYear();
    var container = document.getElementById('filters');
    var btns = [
      { label: 'Année en cours (' + annee + ')', filtre: 'annee_courante', active: true },
      { label: String(annee - 1),                filtre: String(annee - 1), active: false },
      { label: 'Tout le temps',                  filtre: 'tout',            active: false }
    ];
    btns.forEach(function(b) {
      var el = document.createElement('button');
      el.className = 'filter-btn' + (b.active ? ' active' : '');
      el.setAttribute('data-filtre', b.filtre);
      el.textContent = b.label;
      el.onclick = function() { setFiltre(el); };
      container.appendChild(el);
    });
    // Bouton gérer
    var manage = document.createElement('button');
    manage.className = 'btn-manage';
    manage.textContent = '⚙ Gérer les agents';
    manage.onclick = ouvrirGestion;
    container.appendChild(manage);
  }

  // ─── Chargement des données ───────────────────────────────────────────
  function chargerDonnees() {
    document.getElementById('content').innerHTML =
      '<div class="spinner-wrap"><div class="spinner"></div></div>';

    google.script.run
      .withSuccessHandler(function(data) {
        donneesActuelles = data;
        sortCol = 'nom'; sortAsc = true;
        afficher(data);
      })
      .withFailureHandler(function(err) { afficherErreur(err); })
      .getData(filtreActif);
  }

  // ─── Changement de filtre ─────────────────────────────────────────────
  function setFiltre(btn) {
    document.querySelectorAll('.filter-btn').forEach(function(b) {
      b.classList.remove('active');
    });
    btn.classList.add('active');
    filtreActif = btn.getAttribute('data-filtre');
    chargerDonnees();
  }

  // ─── Formatage des durées ─────────────────────────────────────────────
  function formatDuree(minutes) {
    if (!minutes || minutes <= 0) return '—';
    var h = Math.floor(minutes / 60);
    var m = Math.round(minutes % 60);
    if (h === 0) return m + ' min';
    if (m === 0) return h + ' h';
    return h + ' h ' + (m < 10 ? '0' : '') + m;
  }

  // ─── Tri ────────────────────────────────────────────────────────────
  function trierPar(col) {
    if (!donneesActuelles) return;
    if (sortCol === col) {
      sortAsc = !sortAsc;
    } else {
      sortCol = col;
      sortAsc = col === 'nom'; // alpha asc par défaut, numérique desc
    }
    afficher(donneesActuelles);
  }

  // ─── Affichage principal ──────────────────────────────────────────────
  function afficher(data) {
    var postes = ['Door Man', 'Observateur', 'Sécurité', 'Speaker', 'Suiveur'];
    var html = '';

    // ── Tuiles stats ──
    html += '<div class="stats-grid">';

    html += '<div class="stat-card">'
          + '<div class="label">Séances réalisées</div>'
          + '<div class="value">' + data.stats.nbSeances + '</div>'
          + '</div>';

    html += '<div class="stat-card green">'
          + '<div class="label">Durée moyenne / séance</div>'
          + '<div class="value">' + formatDuree(data.stats.dureeMoyenne) + '</div>'
          + '<div class="sub">plafonnée à 40 min</div>'
          + '</div>';

    html += '<div class="stat-card amber">'
          + '<div class="label">Temps total cumulé</div>'
          + '<div class="value">' + formatDuree(data.stats.totalCumule) + '</div>'
          + '<div class="sub">tous agents confondus</div>'
          + '</div>';

    html += '</div>'; // /stats-grid

    // ── Tableau agents ──
    html += '<div class="section-title">Détail par agent</div>';

    if (!data.agents || data.agents.length === 0) {
      html += '<div class="table-wrapper"><div class="empty-msg">'
            + '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">'
            + '<circle cx="12" cy="12" r="10"/>'
            + '<line x1="12" y1="8" x2="12" y2="12"/>'
            + '<line x1="12" y1="16" x2="12.01" y2="16"/>'
            + '</svg>'
            + '<p>Aucune donnée trouvée pour la période sélectionnée.</p>'
            + '</div></div>';
    } else {
      // ── Trier les agents ──
      var agents = data.agents.slice();
      agents.sort(function(a, b) {
        var va, vb;
        if (sortCol === 'nom') {
          va = a.nom.toLowerCase(); vb = b.nom.toLowerCase();
          return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
        } else if (sortCol === 'total') {
          va = a.total || 0; vb = b.total || 0;
        } else {
          va = a.postes[sortCol] || 0; vb = b.postes[sortCol] || 0;
        }
        return sortAsc ? va - vb : vb - va;
      });

      // ── En-têtes avec indicateurs de tri ──
      function thClass(col) {
        if (sortCol !== col) return '';
        return ' class="' + (sortAsc ? 'sort-asc' : 'sort-desc') + '"';
      }

      html += '<div class="table-wrapper"><table>';
      html += '<thead><tr>'
            + '<th' + thClass('nom') + ' onclick="trierPar(\'nom\')">Agent</th>';
      postes.forEach(function(p) {
        html += '<th' + thClass(p) + ' onclick="trierPar(\'' + p.replace(/'/g,"\\'") + '\')">'
              + p + '</th>';
      });
      html += '<th' + thClass('total') + ' onclick="trierPar(\'total\')">Total</th>';
      html += '</tr></thead><tbody>';

      agents.forEach(function(agent) {
        html += '<tr>';
        html += '<td><strong>' + escHtml(agent.nom) + '</strong></td>';
        postes.forEach(function(p) {
          var v = agent.postes[p] || 0;
          if (v > 0) {
            html += '<td>' + formatDuree(v) + '</td>';
          } else {
            html += '<td class="td-zero">—</td>';
          }
        });
        html += '<td class="td-total">' + formatDuree(agent.total) + '</td>';
        html += '</tr>';
      });

      html += '</tbody></table></div>';
    }

    document.getElementById('content').innerHTML = html;
  }

  // ─── Affichage d'erreur ───────────────────────────────────────────────
  function afficherErreur(err) {
    document.getElementById('content').innerHTML =
      '<div class="table-wrapper"><div class="empty-msg">'
      + '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5">'
      + '<circle cx="12" cy="12" r="10"/>'
      + '<line x1="12" y1="8" x2="12" y2="12"/>'
      + '<line x1="12" y1="16" x2="12.01" y2="16"/>'
      + '</svg>'
      + '<p style="color:#ef4444">Erreur lors du chargement des données.<br>'
      + '<small>' + (err && err.message ? escHtml(err.message) : '') + '</small></p>'
      + '</div></div>';
  }

  // ─── Echappement HTML ─────────────────────────────────────────────────
  function escHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ─── Init ─────────────────────────────────────────────────────────────
  window.addEventListener('load', function() {
    buildFiltres();
    chargerDonnees();
  });

  // ─── Gestion des agents ───────────────────────────────────────────────
  function ouvrirGestion() {
    document.getElementById('modalOverlay').classList.add('open');
    chargerListeAgents();
  }

  function fermerGestion() {
    document.getElementById('modalOverlay').classList.remove('open');
  }

  function fermerSiExterieur(e) {
    if (e.target === document.getElementById('modalOverlay')) fermerGestion();
  }

  function chargerListeAgents() {
    document.getElementById('modalAgentsList').innerHTML =
      '<div class="spinner-wrap" style="padding:24px 0"><div class="spinner"></div></div>';
    google.script.run
      .withSuccessHandler(renderListeAgents)
      .withFailureHandler(function(e) {
        document.getElementById('modalAgentsList').innerHTML =
          '<p style="color:#dc2626;font-size:.85rem">Erreur : ' + escHtml(e.message) + '</p>';
      })
      .getAgentsList();
  }

  function renderListeAgents(agents) {
    if (!agents || agents.length === 0) {
      document.getElementById('modalAgentsList').innerHTML =
        '<p style="color:var(--muted);font-size:.88rem">Aucun agent trouvé dans le Spreadsheet.</p>';
      return;
    }
    var html = '';
    agents.forEach(function(a, i) {
      var isHidden = a.hidden;
      var nomEsc = escHtml(a.nom).replace(/'/g, "\\'");
      html += '<div class="agent-row">'
            + '<button class="move-btn" ' + (i === 0 ? 'disabled' : '') + ' onclick="deplacerAgent(\'' + nomEsc + '\',\'up\',this)" title="Monter">↑</button>'
            + '<button class="move-btn" ' + (i === agents.length - 1 ? 'disabled' : '') + ' onclick="deplacerAgent(\'' + nomEsc + '\',\'down\',this)" title="Descendre">↓</button>'
            + '<span class="agent-name' + (isHidden ? ' hidden-name' : '') + '">' + escHtml(a.nom) + '</span>'
            + '<button class="toggle-btn ' + (isHidden ? 'hidden-' : 'visible') + '" '
            + 'onclick="basculerAgent(\'' + nomEsc + '\', this)">'
            + (isHidden ? '👁 Afficher' : '🚫 Masquer')
            + '</button>'
            + '</div>';
    });
    document.getElementById('modalAgentsList').innerHTML = html;
  }

  function deplacerAgent(nom, direction, btn) {
    // Désactiver tous les boutons pendant l'opération
    document.querySelectorAll('.move-btn, .toggle-btn').forEach(function(b) { b.disabled = true; });
    google.script.run
      .withSuccessHandler(function(agents) { renderListeAgents(agents); })
      .withFailureHandler(function(e) {
        document.querySelectorAll('.move-btn, .toggle-btn').forEach(function(b) { b.disabled = false; });
        afficherMsgModal('Erreur : ' + e.message, false);
      })
      .moveAgent(nom, direction);
  }

  function basculerAgent(nom, btn) {
    btn.disabled = true;
    google.script.run
      .withSuccessHandler(function(agents) {
        renderListeAgents(agents);
        chargerDonnees(); // recharger le tableau principal
      })
      .withFailureHandler(function(e) {
        btn.disabled = false;
        afficherMsgModal('Erreur : ' + e.message, false);
      })
      .toggleAgent(nom);
  }

  function ajouterAgent() {
    var input = document.getElementById('newAgentInput');
    var nom = input.value.trim();
    if (!nom) { afficherMsgModal('Veuillez saisir un nom.', false); return; }
    var btn = document.getElementById('btnAjout');
    btn.disabled = true;
    input.disabled = true;
    google.script.run
      .withSuccessHandler(function(result) {
        btn.disabled = false;
        input.disabled = false;
        afficherMsgModal(result.message, result.ok);
        if (result.ok) {
          input.value = '';
          renderListeAgents(result.agents);
          chargerDonnees();
        }
      })
      .withFailureHandler(function(e) {
        btn.disabled = false;
        input.disabled = false;
        afficherMsgModal('Erreur : ' + e.message, false);
      })
      .addAgent(nom);
  }

  function afficherMsgModal(msg, ok) {
    var el = document.getElementById('modalMsg');
    el.textContent = msg;
    el.className = 'modal-msg ' + (ok ? 'ok' : 'err');
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 4000);
  }
</script>

</body>
</html>
